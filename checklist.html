<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการเตรียมของ & สั่งซื้อ - JN Electric</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --primary-color: #1e3a8a; --accent-color: #3b82f6; --text-main: #0f172a; --bg-color: #f8fafc; --border-color: #cbd5e1; }
        body { font-family: 'Sarabun', sans-serif; color: var(--text-main); background-color: var(--bg-color); margin: 0; padding: 20px; }
        
        .container { max-width: 1050px; margin: 0 auto; background: #fff; padding: 25px 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px; margin-bottom: 20px; }
        .header-bar h1 { margin: 0; color: var(--primary-color); font-size: 24px; display: flex; align-items: center; gap: 10px; }
        
        .nav-btns { display: flex; gap: 8px; }
        .btn { padding: 7px 14px; border: none; border-radius: 4px; font-family: 'Sarabun'; font-weight: 600; cursor: pointer; color: white; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-back { background-color: #64748b; }
        .btn-print { background-color: #3b82f6; }
        .btn-dashboard { background-color: #0f172a; }

        .selector-box { background: #f1f5f9; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .selector-box label { font-weight: 700; color: var(--primary-color); font-size: 15px; }
        .selector-box select { padding: 10px 12px; border: 1px solid var(--accent-color); border-radius: 4px; font-family: 'Sarabun'; font-size: 15px; font-weight: 600; width: 100%; outline: none; background: #fff; cursor: pointer; color: var(--text-main); }
        .selector-box select option { padding: 10px; font-size: 14px; }

        .doc-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; padding: 12px 15px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; }
        .summary-item { font-size: 13px; color: #475569; }
        .summary-item strong { color: var(--text-main); font-size: 14px; }

        .progress-container { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .progress-bar-bg { width: 100%; height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s ease; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        th { background-color: #f8fafc; color: var(--primary-color); font-weight: 700; text-align: left; font-size: 14px; border-top: 2px solid var(--primary-color); }
        
        tr.checked-row { background-color: #f0fdf4; }
        tr.checked-row .item-title { text-decoration: line-through; color: #94a3b8; }

        .custom-checkbox { width: 22px; height: 22px; cursor: pointer; accent-color: #10b981; margin-top: 2px; }
        .item-title { font-weight: 600; font-size: 15px; color: var(--text-main); }
        .item-price-tag { font-size: 12px; color: #b45309; font-weight: 600; margin-top: 4px; background: #fef3c7; display: inline-block; padding: 2px 6px; border-radius: 4px;}
        .item-sub { font-size: 13px; color: #64748b; margin-top: 4px; line-height: 1.4;}
        
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-stock { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .badge-adhoc { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

        .btn-link { padding: 6px 12px; border-radius: 4px; font-size: 12px; text-decoration: none; color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; transition: opacity 0.2s; white-space: nowrap; }
        .btn-link:hover { opacity: 0.9; }
        .btn-direct { background: #10b981; }
        .btn-google { background: #2563eb; }

        .print-only-checkbox { display: none; width: 16px; height: 16px; border: 2px solid #000; border-radius: 3px; margin-top: 2px;}

        @media print {
            body { background: #fff; padding: 0; }
            .container { width: 100%; max-width: 100%; box-shadow: none; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            .header-bar { border-bottom: 2px solid #000; }
            .header-bar h1 { color: #000; font-size: 20px; }
            th { background: #fff !important; color: #000 !important; border-top: 2px solid #000; border-bottom: 2px solid #000; }
            td { border-bottom: 1px solid #ccc; padding: 10px 4px; }
            .badge { border: 1px solid #000; color: #000; background: none; }
            .custom-checkbox { display: none; }
            .print-only-checkbox { display: inline-block; }
            tr.checked-row { background: none; }
            tr.checked-row .item-title { text-decoration: none; color: #000; }
            .item-price-tag { border: 1px solid #000; background: none; color: #000;}
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>📋 รายการเตรียมของ & สั่งซื้อ (Checklist)</h1>
        <div class="nav-btns no-print">
            <button class="btn btn-print" onclick="window.print()">🖨️ พิมพ์ใบเช็คของ</button>
            <a href="dashboard.html" class="btn btn-dashboard">📊 แดชบอร์ด</a>
            <a href="index.html" class="btn btn-back">⬅️ หน้าออกบิล</a>
            <a href="project.html" class="btn btn-stock" style="background-color: #1e3a8a;">📊 บริหารโครงการ</a>
        </div>
    </div>

    <!-- ส่วนเลือกเอกสาร -->
    <div class="selector-box no-print">
        <label for="doc-select">📂 เลือกใบเสนอราคา (แสดงเฉพาะใบเสนอราคา):</label>
        <select id="doc-select" onchange="onDocumentSelected()">
            <option value="">-- กำลังโหลดข้อมูล... --</option>
        </select>
    </div>

    <!-- ข้อมูลสรุป -->
    <div class="doc-summary" id="doc-summary" style="display: none;">
        <div class="summary-item">เลขที่บิล: <br><strong id="sum-doc-num">-</strong></div>
        <div class="summary-item">ยอดเงินรวมสุทธิ: <br><strong id="sum-total" style="color:var(--accent-color);">-</strong></div>
        <div class="summary-item">ชื่อลูกค้า: <br><strong id="sum-customer">-</strong></div>
        <div class="summary-item">วันที่: <br><strong id="sum-date">-</strong></div>
    </div>

    <!-- แถบความคืบหน้า -->
    <div class="progress-container no-print" id="progress-container" style="display: none;">
        <div class="progress-label">
            <span>ความคืบหน้าการเตรียมของ</span>
            <span id="progress-text">0 / 0 รายการ (0%)</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- ตารางรายการของ -->
    <table id="checklist-table">
        <thead>
            <tr>
                <th style="width: 5%; text-align: center;">เช็ค</th>
                <th style="width: 55%;">รายการสินค้า / รายละเอียด</th>
                <th style="width: 12%; text-align: center;">จำนวน</th>
                <th style="width: 12%; text-align: center;" class="no-print">ประเภท</th>
                <th style="width: 16%; text-align: center;" class="no-print">สั่งซื้อ</th>
            </tr>
        </thead>
        <tbody id="checklist-tbody">
            <tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 40px; font-size: 16px;">กรุณาเลือกใบเสนอราคาด้านบนเพื่อแสดงรายการเตรียมของครับ</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'https://gqtpqqwipajyiamygrru.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxdHBxcXdpcGFqeWlhbXlncnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTE4NzUsImV4cCI6MjEwMzEyNzg3NX0.upbVr2gm8uUarpYx76UD65_1TO8QcHkVxMx39yEU7dQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allDocs = [];
    let allProducts = [];
    let allCustomers = [];
    let allDocItems = [];
    let currentItems = [];

    window.onload = async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = "index.html"; return; }
        await loadInitialData();
    };

    async function loadInitialData() {
        // ดึงเฉพาะบิลที่ขึ้นต้นด้วย QUO หรือ มีคำว่าเสนอราคา
        const resDocs = await supabaseClient.from('documents').select('*').order('created_at', { ascending: false });
        const resProds = await supabaseClient.from('products').select('*');
        const resCusts = await supabaseClient.from('customers').select('*');
        const resItems = await supabaseClient.from('document_items').select('*');

        if (resDocs.data) {
            // กรองเอาเฉพาะใบเสนอราคา
            allDocs = resDocs.data.filter(d => (d.doc_type || '').includes('เสนอราคา'));
        }
        if (resProds.data) allProducts = resProds.data;
        if (resCusts.data) allCustomers = resCusts.data;
        if (resItems.data) allDocItems = resItems.data;

        populateDocSelector();
    }

    function populateDocSelector() {
        const select = document.getElementById('doc-select');
        select.innerHTML = '<option value="">-- คลิกเพื่อเลือกใบเสนอราคาที่ต้องการเตรียมของ --</option>';

        if(allDocs.length === 0) {
            select.innerHTML = '<option value="">-- ยังไม่มีข้อมูลใบเสนอราคาในระบบ --</option>';
            return;
        }

        allDocs.forEach(doc => {
            const cust = allCustomers.find(c => c.id === doc.customer_id);
            const custName = cust ? cust.customer_name : 'ลูกค้าทั่วไป';
            
            // ค้นหารายการแรกของบิลนี้เพื่อเอามาโชว์เป็นชื่องาน
            const firstItem = allDocItems.find(item => item.document_id === doc.id);
            let firstDesc = "ไม่มีรายการ";
            if(firstItem && firstItem.description) {
                firstDesc = firstItem.description.split('\n')[0].trim();
                if(firstDesc.length > 30) firstDesc = firstDesc.substring(0, 30) + "...";
            }

            const total = doc.grand_total ? doc.grand_total.toLocaleString('th-TH') : '0';
            
            const opt = document.createElement('option');
            opt.value = doc.id;
            // รูปแบบ: QUO-XXX | ชื่อลูกค้า | ยอด XX,XXX.- | (ชื่องาน)
            opt.textContent = `${doc.doc_num}  |  ${custName}  |  ยอดเงิน: ${total}.-  |  (งาน: ${firstDesc})`;
            select.appendChild(opt);
        });
    }

    async function onDocumentSelected() {
        const docId = document.getElementById('doc-select').value;
        if (!docId) {
            document.getElementById('doc-summary').style.display = 'none';
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('checklist-tbody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 40px; font-size: 16px;">กรุณาเลือกใบเสนอราคาด้านบนเพื่อแสดงรายการเตรียมของครับ</td></tr>';
            return;
        }

        const selectedDoc = allDocs.find(d => d.id == docId);
        const cust = allCustomers.find(c => c.id === selectedDoc.customer_id);

        document.getElementById('sum-doc-num').innerText = selectedDoc.doc_num || '-';
        const grandTotal = selectedDoc.grand_total ? selectedDoc.grand_total.toLocaleString('th-TH') : '0';
        document.getElementById('sum-total').innerText = `${grandTotal} บาท`;
        document.getElementById('sum-customer').innerText = cust ? cust.customer_name : 'ลูกค้าทั่วไป';
        document.getElementById('sum-date').innerText = selectedDoc.doc_date || '-';
        document.getElementById('doc-summary').style.display = 'grid';

        currentItems = allDocItems.filter(item => item.document_id == docId);
        renderChecklist();
    }

    function renderChecklist() {
        const tbody = document.getElementById('checklist-tbody');
        tbody.innerHTML = '';

        if (currentItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 40px; font-size: 16px;">ไม่พบรายการสินค้าในเอกสารนี้</td></tr>';
            document.getElementById('progress-container').style.display = 'none';
            return;
        }

        currentItems.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.id = `item-row-${item.id || index}`;

            // ค้นหาสินค้าในสต็อก
            let prod = null;
            const searchName = (item.description || '').split('\n')[0].trim();
            if (item.product_id) {
                prod = allProducts.find(p => p.id === item.product_id);
            } else {
                prod = allProducts.find(p => p.product_name === searchName);
            }

            const storageKey = `checklist_item_${item.id || (item.document_id + '_' + index)}`;
            const isChecked = localStorage.getItem(storageKey) === 'true';
            if (isChecked) tr.classList.add('checked-row');

            // จัดการลิงก์สินค้า
            let linkHtml = '';
            const prodLink = prod ? (prod.link || prod.url || prod.product_url || prod.shop_url) : null;

            if (prodLink && prodLink.trim() !== '') {
                linkHtml = `<a href="${prodLink}" target="_blank" class="btn-link btn-direct">🛒 เปิดร้านค้า</a>`;
            } else {
                const searchKeyword = encodeURIComponent(searchName);
                linkHtml = `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="btn-link btn-google">🔍 ค้นหาใน Google</a>`;
            }

            // จัดรูปแบบข้อความ
            const descLines = (item.description || '').split('\n');
            const mainName = descLines[0];
            const subNotes = descLines.slice(1).join('<br>');
            
            const price = item.price ? item.price.toLocaleString('th-TH') : '0';
            const priceHtml = `<span class="item-price-tag">ราคาในบิล: ${price}.- / หน่วย</span>`;

            tr.innerHTML = `
                <td style="text-align: center;">
                    <input type="checkbox" class="custom-checkbox no-print" ${isChecked ? 'checked' : ''} onchange="toggleItemCheck('${storageKey}', this, 'item-row-${item.id || index}')">
                    <span class="print-only-checkbox"></span>
                </td>
                <td>
                    <div class="item-title">${mainName}</div>
                    ${priceHtml}
                    ${subNotes ? `<div class="item-sub">${subNotes}</div>` : ''}
                </td>
                <td style="text-align: center; font-weight: 700; font-size: 16px; color: var(--primary-color);">
                    ${item.qty} ${item.unit || 'ชิ้น'}
                </td>
                <td style="text-align: center;" class="no-print">
                    ${prod ? '<span class="badge badge-stock">📦 สินค้าคลัง</span>' : '<span class="badge badge-adhoc">📝 จัดซื้อทั่วไป</span>'}
                </td>
                <td style="text-align: center;" class="no-print">
                    ${linkHtml}
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('progress-container').style.display = 'block';
        updateProgress();
    }

    function toggleItemCheck(key, checkbox, rowId) {
        localStorage.setItem(key, checkbox.checked);
        const row = document.getElementById(rowId);
        if (checkbox.checked) { row.classList.add('checked-row'); } 
        else { row.classList.remove('checked-row'); }
        updateProgress();
    }

    function updateProgress() {
        const checkboxes = document.querySelectorAll('.custom-checkbox');
        const total = checkboxes.length;
        const checked = document.querySelectorAll('.custom-checkbox:checked').length;
        const percent = total > 0 ? Math.round((checked / total) * 100) : 0;

        document.getElementById('progress-text').innerText = `${checked} / ${total} รายการ (${percent}%)`;
        document.getElementById('progress-fill').style.width = `${percent}%`;
    }
</script>
</body>
</html>
